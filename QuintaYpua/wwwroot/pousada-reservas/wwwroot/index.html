<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pousada Quinta Ypua - Reservas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Faça sua Reserva</h1>
    </header>
    <main>
                <form id="formCadastro">
                    <ul class="nav nav-tabs mb-3" id="tabCadastro" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="tab-dados" data-bs-toggle="tab" data-bs-target="#dadosCliente" type="button" role="tab">Dados do Cliente</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="tab-quarto" data-bs-toggle="tab" data-bs-target="#selecaoQuarto" type="button" role="tab">Selecionar Quarto</button>
                        </li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="dadosCliente" role="tabpanel">
                            <label for="nome">Nome:</label>
                            <input type="text" id="nome" required>
                            <label for="checkin">Data de Check-in:</label>
                            <input type="date" id="checkin" required>
                            <label for="checkout">Data de Check-out:</label>
                            <input type="date" id="checkout" required>
                        </div>
                        <div class="tab-pane fade" id="selecaoQuarto" role="tabpanel">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="quartoSelect">Selecione o Quarto:</label>
                                    <select id="quartoSelect" class="form-select mb-2" required>
                                        <option value="">Selecione...</option>
                                    </select>
                                    <div id="quartoInfo" class="mb-2"></div>
                                </div>
                                <div class="col-12">
                                    <label for="fotoQuarto">Foto do Quarto:</label>
                                    <input type="file" id="fotoQuarto" accept="image/*" class="form-control mb-2" />
                                    <img id="previewFotoQuarto" src="" alt="Prévia da Foto" style="display:none; max-width:120px; max-height:120px; border-radius:8px; margin-bottom:8px;" />
                                    <input type="hidden" id="quarto" required>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="mt-3">Reservar</button>
                </form>
        <p>Já tem uma reserva? <a href="reservas.html">Veja suas reservas aqui</a>.</p>
    </main>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <script src="js/novosClientes.js"></script>
            <script>
            // Quartos disponíveis (6 quartos)
            const quartos = [
                { numero: "101", valor: 200, descricao: "Quarto Standard com vista para o jardim." },
                { numero: "102", valor: 210, descricao: "Quarto Standard com varanda privativa." },
                { numero: "201", valor: 230, descricao: "Quarto Luxo com cama king size." },
                { numero: "202", valor: 250, descricao: "Quarto Luxo com banheira de hidromassagem." },
                { numero: "301", valor: 180, descricao: "Quarto Econômico, ideal para casais." },
                { numero: "302", valor: 220, descricao: "Quarto Família com dois ambientes." }
            ];
            const select = document.getElementById('quartoSelect');
            const inputQuarto = document.getElementById('quarto');
            const info = document.getElementById('quartoInfo');
            const fotoInput = document.getElementById('fotoQuarto');
            const previewFoto = document.getElementById('previewFotoQuarto');
            let fotoBase64 = "";

            quartos.forEach(q => {
                const opt = document.createElement('option');
                opt.value = q.numero;
                opt.textContent = `Quarto ${q.numero} - R$ ${q.valor.toFixed(2)}`;
                select.appendChild(opt);
            });

            select.addEventListener('change', function() {
                const q = quartos.find(q => q.numero === select.value);
                if (q) {
                    info.innerHTML = `<strong>Descrição:</strong> ${q.descricao}<br><strong>Valor:</strong> R$ ${q.valor.toFixed(2)}`;
                    inputQuarto.value = q.numero;
                } else {
                    info.innerHTML = "";
                    inputQuarto.value = "";
                }
            });

            fotoInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        fotoBase64 = evt.target.result;
                        previewFoto.src = fotoBase64;
                        previewFoto.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else {
                    fotoBase64 = "";
                    previewFoto.src = "";
                    previewFoto.style.display = 'none';
                }
            });
            </script>
</body>
</html>

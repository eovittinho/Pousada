<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Status das Reservas - Quinta do Ypuá</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg custom-navbar px-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">Pousada Quinta do Ypuá</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
        <ul class="navbar-nav mb-2 mb-lg-0 align-items-center gap-2">
          <li class="nav-item"><a class="nav-link" href="index.html">🏠 Início</a></li>
          <li class="nav-item"><a class="nav-link" href="reservas.html">📅 Reservas</a></li>
          <li class="nav-item"><a class="nav-link active" href="status.html">🛏️ Status</a></li>
          <li class="nav-item"><a class="btn btn-outline-light btn-sm" href="index.html">Sair</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-4 pt-4 pb-2 flex-grow-1">
    <h1 class="text-center">Status das Reservas</h1>

    <!-- Filtros -->
    <div class="row mb-4 filtros">
      <div class="col-md-3 mb-2">
        <input type="text" id="filtroNome" class="form-control border-warning text-black" placeholder="🔍 Buscar por nome ou quarto" />
      </div>
    </div>
    <div id="paginacao" class="mb-2 d-flex justify-content-center gap-2"></div>

    <div class="table-responsive">
      <table class="table table-hover table-bordered text-white align-middle" id="tabelaStatus">
        <thead>
          <tr>
            <th>ID Reserva</th>
            <th>Nome do Cliente</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <footer class="mt-auto py-3 text-center text-light" style="background-color: #4b2e2e">
    &copy; 2025 Pousada Quinta do Ypuá. Todos os direitos reservados.
  </footer>

  <!-- Modal Detalhes -->
  <div class="modal fade" id="modalDetalhes" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark text-light">
        <div class="modal-header">
          <h5 class="modal-title">Detalhes da Reserva</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="detalhesCliente"></div>
          <hr>
          <h6>Gastos Extras</h6>
          <div id="listaGastosExtrasContainer"></div>
          <span id="totalGastosExtras"></span>

          <!-- Seleção de produtos -->
          <form id="formGastoExtra" class="row g-2 mt-2">
            <div class="col-md-5">
              <select class="form-select" id="produtoGasto">
                <option value="">Selecione um produto</option>
              </select>
            </div>
            <div class="col-md-2">
              <input type="number" class="form-control" id="quantidadeGasto" placeholder="Qtd." min="1" step="1" value="1" required>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-success w-100">Adicionar</button>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Produtos disponíveis
    const produtos = [
  { descricao: "Água Mineral", valor: 5 },
  { descricao: "Café da Manhã", valor: 20 },
  { descricao: "Almoço Buffet", valor: 35 },
  { descricao: "Jantar à la carte", valor: 50 },
  { descricao: "Serviço de Lavanderia (peça)", valor: 15 },
  { descricao: "Wi-Fi Premium", valor: 10 },
  { descricao: "Aluguel de Bicicleta", valor: 25 },
  { descricao: "Passeio Guiado (meio-dia)", valor: 80 },
  { descricao: "Massagem Relaxante", valor: 90 },
  { descricao: "Estacionamento (diária)", valor: 15 },
  { descricao: "Acesso à Piscina Aquecida", valor: 20 },
  { descricao: "Serviço de Concierge", valor: 25 },
  { descricao: "Transfer para a Praia", valor: 40 },
  { descricao: "Kit de Praia (toalha, guarda-sol, cadeira)", valor: 25 },
  { descricao: "Mini Bar (por item)", valor: 8 },
  { descricao: "Transporte Aeroporto", valor: 60 },
  { descricao: "Serviço de Quarto", valor: 30 },
  { descricao: "Tour Cultural", valor: 100 },
];

    const precosQuartos = { "101": 200, "202": 250, "303": 180, "404": 220 };
    const clientesAntigos = [
      { id: 1001, nome: "Maria Silva", status: "Confirmado", quarto: "101", gastosExtras: [] },
      { id: 1002, nome: "João Pereira", status: "Pré-Reserva", quarto: "202", gastosExtras: [] },
      { id: 1003, nome: "Ana Costa", status: "Cancelado", quarto: "303", gastosExtras: [] },
      { id: 1004, nome: "Lucas Alves", status: "Hospedado", quarto: "404", gastosExtras: [] }
    ];
    const novosClientes = JSON.parse(localStorage.getItem('novosClientes')) || [];
    let contadorReservas = 1005;
    const tbody = document.querySelector('#tabelaStatus tbody');

    // Preencher select de produtos
    const selectProdutos = document.getElementById('produtoGasto');
    produtos.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${p.descricao} - R$ ${p.valor.toFixed(2)}`;
      selectProdutos.appendChild(opt);
    });

    function abrirModalDetalhes(cliente, idReserva, isNovoCliente = false) {
      let clienteAtual = cliente;
      let gastosExtras = [];

      if (isNovoCliente) {
        const clientes = JSON.parse(localStorage.getItem('novosClientes')) || [];
        clienteAtual = clientes.find(c => c.nome === cliente.nome && c.quarto === cliente.quarto && c.checkin === cliente.checkin && c.checkout === cliente.checkout) || cliente;
        gastosExtras = clienteAtual.gastosExtras || [];
      } else {
        const key = 'gastosExtrasAntigos_' + idReserva;
        gastosExtras = JSON.parse(localStorage.getItem(key)) || [];
      }

      document.getElementById('detalhesCliente').innerHTML = `
        <strong>ID Reserva:</strong> ${idReserva}<br>
        <strong>Nome:</strong> ${clienteAtual.nome}<br>
        <strong>Quarto:</strong> ${clienteAtual.quarto || 'Não informado'}<br>
        <strong>Preço do Quarto:</strong> ${precosQuartos[clienteAtual.quarto] ? 'R$ ' + precosQuartos[clienteAtual.quarto].toFixed(2) : 'Não informado'}<br>
        <strong>Status:</strong> ${clienteAtual.status}<br>
      `;
      renderizarGastosExtras(gastosExtras);
      window.clienteModal = { cliente: clienteAtual, idReserva, isNovoCliente };
      document.getElementById('quantidadeGasto').value = 1;
      selectProdutos.value = "";

      bootstrap.Modal.getOrCreateInstance(document.getElementById('modalDetalhes')).show();
    }

    function renderizarGastosExtras(gastosExtras) {
      const container = document.getElementById('listaGastosExtrasContainer');
      container.innerHTML = '';
      let total = 0;

      if (gastosExtras.length > 0) {
        gastosExtras.forEach((g, i) => {
          const subtotal = g.valor * (g.quantidade || 1);
          const div = document.createElement('div');
          div.className = "d-flex align-items-center mb-1";
          div.innerHTML = `
            <span>${g.descricao} - Qtd: ${g.quantidade} - R$ ${subtotal.toFixed(2)}</span>
            <button class="btn p-0 text-danger ms-2" onclick="excluirGastoExtra(${i})">
              <i class="bi bi-trash"></i>
            </button>
          `;
          container.appendChild(div);
          total += subtotal;
        });
      } else {
        container.innerHTML = '<em>Sem gastos extras registrados.</em>';
      }

      document.getElementById('totalGastosExtras').textContent = 'Total: R$ ' + total.toFixed(2);
    }

    // Adicionar clientes antigos
    clientesAntigos.forEach(cliente => {
      let badgeClass = cliente.status === 'Confirmado' ? 'bg-success' :
                       cliente.status === 'Pré-Reserva' ? 'bg-warning text-dark' :
                       cliente.status === 'Cancelado' ? 'bg-danger' : 'bg-primary';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${cliente.id}</td>
        <td>${cliente.nome}</td>
        <td><span class="badge ${badgeClass}">${cliente.status}</span></td>
        <td><button class="btn btn-sm btn-light" onclick="abrirModalDetalhes(clientesAntigos[${cliente.id - 1001}], ${cliente.id}, false)">Ver Detalhes</button></td>
      `;
      tbody.appendChild(tr);
    });

    // Adicionar novos clientes
    novosClientes.forEach((cliente, idx) => {
      const idReserva = contadorReservas + idx;
      let badgeClass = cliente.status === 'Confirmado' ? 'bg-success' :
                       cliente.status === 'Pré-Reserva' ? 'bg-warning text-dark' :
                       cliente.status === 'Cancelado' ? 'bg-danger' : 'bg-primary';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${idReserva}</td>
        <td>${cliente.nome}</td>
        <td><span class="badge ${badgeClass}">${cliente.status}</span></td>
        <td><button class="btn btn-sm btn-light" onclick="abrirModalDetalhes(JSON.parse(localStorage.getItem('novosClientes'))[${idx}], ${idReserva}, true)">Ver Detalhes</button></td>
      `;
      tbody.appendChild(tr);
    });

    // FILTROS / PAGINAÇÃO
    let paginaAtual = 1;
    const linhasPorPagina = 6;

    function filtrarTabela() {
      const termoNome = document.getElementById('filtroNome').value.toLowerCase();
      Array.from(document.querySelectorAll('#tabelaStatus tbody tr')).forEach(row => {
        const nome = row.cells[1].textContent.toLowerCase();
        row.style.display = nome.includes(termoNome) ? '' : 'none';
      });
      paginaAtual = 1;
      paginarTabela();
    }

    function paginarTabela() {
      const linhas = Array.from(document.querySelectorAll('#tabelaStatus tbody tr')).filter(r => r.style.display !== "none");
      linhas.forEach((row, idx) => row.style.display = (idx >= (paginaAtual - 1) * linhasPorPagina && idx < paginaAtual * linhasPorPagina) ? '' : 'none');
      atualizarPaginacao(linhas.length);
    }

    function atualizarPaginacao(totalLinhas) {
      let totalPaginas = Math.ceil(totalLinhas / linhasPorPagina);
      let paginacao = document.getElementById('paginacao');
      paginacao.innerHTML = '';
      if (totalPaginas > 1) {
        for (let i = 1; i <= totalPaginas; i++) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-sm ' + (i === paginaAtual ? 'btn-primary' : 'btn-outline-primary');
          btn.textContent = i;
          btn.onclick = () => { paginaAtual = i; paginarTabela(); };
          paginacao.appendChild(btn);
        }
      }
    }

    document.getElementById('filtroNome').addEventListener('input', filtrarTabela);
    window.onload = filtrarTabela;

    // Adicionar gasto extra
    document.getElementById('formGastoExtra').addEventListener('submit', function(e){
      e.preventDefault();
      const idxProduto = parseInt(document.getElementById('produtoGasto').value);
      const quantidade = parseInt(document.getElementById('quantidadeGasto').value) || 1;
      if (isNaN(idxProduto)) return;

      const produto = produtos[idxProduto];
      const { isNovoCliente, cliente, idReserva } = window.clienteModal;

      if (isNovoCliente) {
        let clientes = JSON.parse(localStorage.getItem('novosClientes')) || [];
        const idx = clientes.findIndex(c => c.nome === cliente.nome && c.quarto === cliente.quarto && c.checkin === cliente.checkin && c.checkout === cliente.checkout);
        if (idx !== -1) {
          if (!Array.isArray(clientes[idx].gastosExtras)) clientes[idx].gastosExtras = [];
          clientes[idx].gastosExtras.push({ descricao: produto.descricao, valor: produto.valor, quantidade });
          localStorage.setItem('novosClientes', JSON.stringify(clientes));
          renderizarGastosExtras(clientes[idx].gastosExtras);
        }
      } else {
        const key = 'gastosExtrasAntigos_' + idReserva;
        let arr = JSON.parse(localStorage.getItem(key)) || [];
        arr.push({ descricao: produto.descricao, valor: produto.valor, quantidade });
        localStorage.setItem(key, JSON.stringify(arr));
        renderizarGastosExtras(arr);
      }

      document.getElementById('produtoGasto').value = "";
      document.getElementById('quantidadeGasto').value = 1;
    });

    function excluirGastoExtra(idx) {
      const { isNovoCliente, cliente, idReserva } = window.clienteModal;

      if (isNovoCliente) {
        let clientes = JSON.parse(localStorage.getItem('novosClientes')) || [];
        const cIdx = clientes.findIndex(c => c.nome === cliente.nome && c.quarto === cliente.quarto && c.checkin === cliente.checkin && c.checkout === cliente.checkout);
        if (cIdx !== -1) {
          clientes[cIdx].gastosExtras.splice(idx, 1);
          localStorage.setItem('novosClientes', JSON.stringify(clientes));
          renderizarGastosExtras(clientes[cIdx].gastosExtras);
        }
      } else {
        const key = 'gastosExtrasAntigos_' + idReserva;
        let arr = JSON.parse(localStorage.getItem(key)) || [];
        arr.splice(idx, 1);
        localStorage.setItem(key, JSON.stringify(arr));
        renderizarGastosExtras(arr);
      }
    }
  </script>
</body>
</html>
